name: Verify

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  public_history:
    name: Public history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Test public-history scanner
        run: python3 -m unittest discover -s scripts/tests -p 'test_public_history_scan.py'
      - name: Scan worktree and HEAD history
        if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        run: npm run scan:public
      - name: Audit every fetched ref before release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        run: npm run scan:public:all

  supply_chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check lockfile policy
        run: npm run check:lockfile
      - name: Audit known high-severity vulnerabilities
        run: npm audit --package-lock-only --audit-level=high
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify registry signatures
        run: npm audit signatures

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:unit
      - name: Build standalone application
        run: npm run build

  database:
    name: Database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Provision isolated databases and roles
        run: |
          docker exec --interactive "${{ job.services.postgres.id }}" \
            psql --set ON_ERROR_STOP=1 --username postgres --dbname postgres \
            < scripts/ci/provision-postgres.sql
      - name: Migrate primary database from empty state
        env:
          APP_MODE: primary
          PRIMARY_MIGRATION_DATABASE_URL: postgresql://primary_migrator:primary_migrator_ci@127.0.0.1:5432/project_desk_primary
        run: npm run db:migrate:primary
      - name: Repeat primary migration
        env:
          APP_MODE: primary
          PRIMARY_MIGRATION_DATABASE_URL: postgresql://primary_migrator:primary_migrator_ci@127.0.0.1:5432/project_desk_primary
        run: npm run db:migrate:primary
      - name: Migrate demo database from empty state
        env:
          APP_MODE: demo
          DEMO_MIGRATION_DATABASE_URL: postgresql://demo_migrator:demo_migrator_ci@127.0.0.1:5432/project_desk_demo
        run: npm run db:migrate:demo
      - name: Repeat demo migration
        env:
          APP_MODE: demo
          DEMO_MIGRATION_DATABASE_URL: postgresql://demo_migrator:demo_migrator_ci@127.0.0.1:5432/project_desk_demo
        run: npm run db:migrate:demo
      - name: Verify PostgreSQL boundaries
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres_ci@127.0.0.1:5432/postgres
          TEST_PRIMARY_APP_URL: postgresql://primary_app:primary_app_ci@127.0.0.1:5432/project_desk_primary
          TEST_PRIMARY_MIGRATOR_URL: postgresql://primary_migrator:primary_migrator_ci@127.0.0.1:5432/project_desk_primary
          TEST_DEMO_APP_URL: postgresql://demo_app:demo_app_ci@127.0.0.1:5432/project_desk_demo
          TEST_DEMO_MIGRATOR_URL: postgresql://demo_migrator:demo_migrator_ci@127.0.0.1:5432/project_desk_demo
        run: npm run test:integration

  browser:
    name: Browser
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build standalone application
        run: npm run build
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --pull --tag zhenghao-project-desk:${{ github.sha }} .
      - name: Smoke-test hardened runtime
        run: |
          set -euo pipefail
          container_name="project-desk-${GITHUB_RUN_ID}"
          container_port="$((20000 + GITHUB_RUN_NUMBER % 20000))"
          cleanup() {
            status=$?
            trap - EXIT
            if ((status != 0)); then
              docker logs "$container_name" || true
            fi
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --read-only \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,size=64m \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --env "APP_VERSION=0.1.0-ci" \
            --env "BUILD_SHA=${GITHUB_SHA}" \
            --env "PORT=${container_port}" \
            --publish "127.0.0.1::${container_port}" \
            "zhenghao-project-desk:${GITHUB_SHA}"

          host_port="$(docker port "$container_name" "${container_port}/tcp" | awk -F: 'NR == 1 { print $NF }')"
          base_url="http://127.0.0.1:${host_port}"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${base_url}/health" >health.json; then
              break
            fi
            if ((attempt == 30)); then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error "${base_url}/" >landing.html
          asset_path="$(grep -oE '/_next/static/[^\" ]+\.css' landing.html | sed -n '1p')"
          test -n "$asset_path"
          curl --fail --silent --show-error "${base_url}${asset_path}" >/dev/null
          test "$(docker exec "$container_name" id -u)" = "10001"
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: zhenghao-project-desk:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  gate:
    name: Verify gate
    if: always()
    needs:
      - public_history
      - supply_chain
      - quality
      - database
      - browser
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.public_history.result }}" \
            "${{ needs.supply_chain.result }}" \
            "${{ needs.quality.result }}" \
            "${{ needs.database.result }}" \
            "${{ needs.browser.result }}" \
            "${{ needs.container.result }}"; do
            test "$result" = "success"
          done
